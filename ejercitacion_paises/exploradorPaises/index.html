<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de Países de Europa</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1 class="my-4">Países de Europa</h1>

    <button id="btnCargar" class="btn btn-primary mb-4">
      Cargar países desde la API
    </button>

    <div id="mensaje" class="mb-3 text-muted"></div>

    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Bandera</th>
          <th>País</th>
          <th>Capital</th>
          <th>Población</th>
          <th>Area (km²)</th>
        </tr>
      </thead>
      <tbody id="tablaBody">
<!-- Las filas se insertan con JavaScript -->
      </tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="paises.js"></script>
</body>
</html>
