<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap - Grilla básica</title>
  <!-- Bootstrap 5 CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .box {
      background: #f8f9fa;
      border: 2px dashed #ced4da;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Ejercicio 01 - Grilla responsive</h1>

    <div class="row g-3">
      <!-- 1 col en XS (col-12), 2 col en MD (col-md-6), 3 col en LG (col-lg-4) -->
      <div class="col-12 col-md-6 col-lg-4"><div class="box">1</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">2</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">3</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">4</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">5</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">6</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">7</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">8</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="box">9</div></div>
    </div>
  </main>

  <!-- Bootstrap 5 JS (opcional para este ejercicio) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
